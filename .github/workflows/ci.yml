name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build localized pages
        run: SITE_URL="https://weguest.github.io/driversize-site" node build.mjs

      - name: Check generated pages
        run: |
          test -f index.html
          test -f en/index.html
          test -f es/index.html
          test -f fr/index.html
          grep -q 'https://weguest.github.io/driversize-site/' index.html
          git diff --exit-code
